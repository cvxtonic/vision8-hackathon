# Holds a live conversation open for ~15 s so the client's audio diagnostics show up in the voice-kit log.
appId: ai.innofy.vision8
---
- launchApp:
    clearState: true
    permissions:
      microphone: allow
- tapOn: "Erstgespräch starten"
- tapOn: "Dein Vorname"
- inputText: "Mia"
- pressKey: Enter
- tapOn: "Gesundheit"
- tapOn: "Im Gespräch"
- extendedWaitUntil:
    visible: "Der Coach spricht"
    timeout: 20000
- extendedWaitUntil:
    visible: "this text never appears"
    timeout: 15000
    optional: true
- tapOn: "Lieber tippen"
